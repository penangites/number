name: Bug report
description: Something produced a wrong value, threw unexpectedly, or failed to throw.
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.4.9
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest snippet that shows the problem.
      render: php
      value: |
        use Penangites\Number\Number;

        Number::of('...')
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact output or exception message.
    validations:
      required: true
